[project]
name = "homelab-common"
version = "0.1.0"
description = "Shared base for Nav's homelab services"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "fastmcp>=4",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-system-metrics>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
homelab-common = "homelab_common.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "homelab_common"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "types-pyyaml>=6.0.12.20261113",
    "alembic>=1.20.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["SPEC.md", "template"]  # stamped services are checked as services (their own ruff)

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "ANN", "C90", "C416", "PLR0912", "PLR0915", "PLR2004", "S608"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # expected values in asserts read better inline

[tool.pyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
pythonVersion = "3.14"
include = ["src", "tests", "platform/sql-tool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real Postgres in HOMELAB_TEST_DATABASE_URL"]
