# homelab-common platform stack (SPEC section 3). Deployed by the homelab repo's deploy.sh.
name: homelab-platform

services:
  postgres:
    image: postgres:17.12
    network_mode: host # reachable at 127.0.0.1:5432 and 172.29.0.1:5432 (the homelab bridge gateway)
    user: "1000:1000"
    restart: always
    stop_grace_period: 60s # the image stops with SIGINT (fast shutdown); give it time to checkpoint
    oom_score_adj: -500 # under memory pressure the kernel kills the apps before the database
    # Postgres only warns when a listen address does not exist yet, then serves loopback only while reporting
    # healthy, and every service is cut off. Wait for the bridge address (a reboot can start this first), else
    # exit so the restart policy tries again.
    entrypoint:
      - sh
      - -c
      - |
        for _ in $$(seq 120); do
          grep -q -- '|-- 172.29.0.1$$' /proc/net/fib_trie && exec docker-entrypoint.sh "$$@"
          sleep 1
        done
        echo "172.29.0.1 never appeared: is the homelab network up?" >&2
        exit 1
      - sh
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1,172.29.0.1
      - -c
      - port=5432
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run through deploy.sh, which passes --env-file the decrypted secrets}
      POSTGRES_USER: postgres
      POSTGRES_DB: homelab
    volumes:
      - ${HOMELAB_PG_DATA:-/home/veronica/.local/state/homelab-postgres}:/var/lib/postgresql/data:z
      - ./sql:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres && pg_isready -h 172.29.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.11
    restart: always
    oom_score_adj: -200
    networks:
      - homelab
    ports:
      - "127.0.0.1:8480:8480" # the only published port in the platform (SPEC section 3)
    volumes:
      - ${HOMELAB_DIR:-/home/veronica/homelab}/caddy:/etc/caddy:ro,z
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8480/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sql:
    build:
      context: ..
      dockerfile: platform/sql-tool/Dockerfile
    image: homelab/sql:local
    pull_policy: build
    container_name: sql
    restart: always
    networks:
      - homelab
    env_file: ${HOMELAB_DIR:-/home/veronica/homelab}/generated/env/sql.env
    environment:
      DATABASE_HOST: 172.29.0.1
      DATABASE_SCHEMA: common
      DATABASE_USER: jarvis_ro
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?run through deploy.sh, which passes --env-file the decrypted secrets}
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m # a leak is OOM-killed inside this cgroup and restarted, not left to hurt the host
    oom_score_adj: 300
    depends_on:
      postgres:
        condition: service_healthy

networks:
  homelab:
    external: true
