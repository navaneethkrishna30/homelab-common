# homelab-common platform stack (SPEC section 3). Deployed by the homelab repo's deploy.sh.
name: homelab-platform

services:
  postgres:
    image: postgres:17.12
    network_mode: host # reachable at 127.0.0.1:5432 and 172.29.0.1:5432 (the homelab bridge gateway)
    user: "1000:1000"
    restart: always
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1,172.29.0.1
      - -c
      - port=5432
      - -c
      - timezone=UTC # Langfuse shares this server and requires UTC
      - -c
      - log_timezone=UTC
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run through deploy.sh, which passes --env-file the decrypted secrets}
      POSTGRES_USER: postgres
      POSTGRES_DB: homelab
    volumes:
      - ${HOMELAB_PG_DATA:-/home/veronica/.local/state/homelab-postgres}:/var/lib/postgresql/data:z
      - ./sql:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.11
    restart: always
    networks:
      - homelab
    ports:
      - "127.0.0.1:8480:8480" # the only published port in the platform (SPEC section 3)
    volumes:
      - ${HOMELAB_DIR:-/home/veronica/homelab}/caddy:/etc/caddy:ro,z
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8480/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sql:
    build:
      context: ..
      dockerfile: platform/sql-tool/Dockerfile
    image: homelab/sql:local
    pull_policy: build
    container_name: sql
    restart: always
    networks:
      - homelab
    env_file: ${HOMELAB_DIR:-/home/veronica/homelab}/generated/env/sql.env
    environment:
      DATABASE_HOST: 172.29.0.1
      DATABASE_SCHEMA: common
      DATABASE_USER: jarvis_ro
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?run through deploy.sh, which passes --env-file the decrypted secrets}
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy

networks:
  homelab:
    external: true
